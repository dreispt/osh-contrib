# Bundle distribution — ships every osh_* plugin in one install.
# Used for development (`pip install -e .`) and as the install-all spec
# (`pipx inject osh "osh-contrib @ git+…"`). Each plugin is also its own
# distribution under its directory (osh_dbstats/pyproject.toml, ...) for
# granular installs. Do NOT install the bundle together with individual
# plugin dists — they ship the same packages and collide.
#
# `osh` 1.7.0+ is required for the [tool.osh] reader in each plugin's
# pyproject.toml. The `osh` name on PyPI resolves to an unrelated package,
# so install osh (from source/git) before or alongside this dist — never
# let the resolver fetch `osh` from PyPI.
[project]
name = "osh-contrib"
version = "0.1.0"
description = "Contrib plugins for the osh CLI (Odoo Shell)"
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "osh>=1.7.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/dreispt/osh-contrib"
Source = "https://github.com/dreispt/osh-contrib"

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["osh_*"]

# Ship each plugin's pyproject.toml inside its package — osh reads the
# plugin's [tool.osh] declarations from it without importing the plugin.
[tool.setuptools.package-data]
"*" = ["pyproject.toml"]

# Register all bundled plugins on the `osh.plugins` entry-point group.
[project.entry-points."osh.plugins"]
osh_dbstats = "osh_dbstats"
osh_echohttp = "osh_echohttp"
osh_migrations = "osh_migrations"
osh_uninstall = "osh_uninstall"
osh_update = "osh_update"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = ["E501"]  # line length handled by black
