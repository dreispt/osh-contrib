[project]
name = "osh-contrib"
version = "0.1.0"
description = "Contrib plugins for the osh CLI (Odoo Shell)"
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/dreispt/osh-contrib"
Source = "https://github.com/dreispt/osh-contrib"

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["osh_*"]

[tool.setuptools.package-data]
"*" = ["osh-plugin.toml"]

# Register plugins for pip installs as well:
[project.entry-points."osh.plugins"]
osh_echohttp = "osh_echohttp"
osh_uninstall = "osh_uninstall"
osh_update = "osh_update"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = ["E501"]  # line length handled by black
