[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-uninstall"
version = "0.2.0"
description = "Uninstall Odoo modules — and their dependents — from a database."
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh"]
dependencies = [
    "click>=8.1",
    "osh>=1.9.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.entry-points."osh.plugins"]
osh_uninstall = "osh_uninstall"

[tool.osh.group_commands.apps]
uninstall = "Uninstall Odoo modules from a database."

# Deprecated spelling — kept working, hidden from `osh db --help`.
[tool.osh.group_commands.db]
uninstall = {help = "Deprecated — use 'osh apps uninstall'.", hidden = true}

[tool.setuptools]
package-dir = {"osh_uninstall" = "."}
packages = ["osh_uninstall"]

# Ship pyproject.toml inside the package — osh reads [tool.osh] from it
# without importing the plugin.
[tool.setuptools.package-data]
osh_uninstall = ["pyproject.toml"]
