[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-runtime-kiri"
version = "0.1.0"
description = "Run Odoo in a Compose stack on the Kiri container engine."
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh", "kiri"]
dependencies = [
    "click>=8.1",
    "osh>=2.0.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.entry-points."osh.plugins"]
osh_runtime_kiri = "osh_runtime_kiri"

[tool.osh]
min_osh = "2.0.0"
depends = ["osh-runtime-docker"]
extends = ["odoo"]

[tool.osh.runtimes]
kiri = "Run Odoo in a Compose stack on the Kiri container engine."

[tool.setuptools]
package-dir = {"osh_runtime_kiri" = "."}
packages = ["osh_runtime_kiri"]

# Ship pyproject.toml inside the package — osh reads [tool.osh] from it
# without importing the plugin.
[tool.setuptools.package-data]
osh_runtime_kiri = ["pyproject.toml"]
