[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-update"
version = "0.2.0"
description = "Install modules and update the ones whose code changed since the last update."
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh"]
dependencies = [
    "click>=8.1",
    "osh>=1.9.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.entry-points."osh.plugins"]
osh_update = "osh_update"

[tool.osh]
extends = ["backup.restore"]

[tool.osh.group_commands.apps]
install = "Install Odoo modules in a database."
list = "List installed modules in a database."
update = "Update project modules whose code changed."

# Deprecated spellings — kept working, hidden from `osh db --help`.
[tool.osh.group_commands.db]
installed = {help = "Deprecated — use 'osh apps list'.", hidden = true}
update = {help = "Deprecated — use 'osh apps update'.", hidden = true}

[tool.setuptools]
package-dir = {"osh_update" = "."}
packages = ["osh_update"]

# Ship pyproject.toml inside the package — osh reads [tool.osh] from it
# without importing the plugin.
[tool.setuptools.package-data]
osh_update = ["pyproject.toml"]
