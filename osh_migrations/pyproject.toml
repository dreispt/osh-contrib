[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-migrations"
version = "0.1.0"
description = "Collect OCA migration scripts across version branches."
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh"]
dependencies = [
    "click>=8.1",
    "osh>=1.1",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.entry-points."osh.plugins"]
osh_migrations = "osh_migrations"

[tool.setuptools]
package-dir = {"osh_migrations" = "."}
packages = ["osh_migrations"]

[tool.setuptools.package-data]
osh_migrations = ["osh-plugin.toml"]
