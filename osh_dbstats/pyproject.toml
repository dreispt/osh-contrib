[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-dbstats"
version = "0.1.0"
description = "Dashboard of an Odoo database's size, bloat and activity."
authors = [
    {name = "Daniel Reis"}
]
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development", "osh"]
dependencies = [
    "click>=8.1",
    "osh>=1.7.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.entry-points."osh.plugins"]
osh_dbstats = "osh_dbstats"

[tool.osh.group_commands.db]
stats = "Diagnose an Odoo database: size, bloat, indexes, activity."
vacuum = "Run VACUUM ANALYZE on the database or selected tables."

[tool.setuptools]
package-dir = {"osh_dbstats" = "."}
packages = ["osh_dbstats"]

# Ship pyproject.toml inside the package — osh reads [tool.osh] from it
# without importing the plugin.
[tool.setuptools.package-data]
osh_dbstats = ["pyproject.toml"]
